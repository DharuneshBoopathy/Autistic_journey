AWSTemplateFormatVersion: '2010-09-09'
Description: 'The Autistic Journey - Production S3 Private Media Vault and IAM Policies'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Target deployment environment'
  
  MediaBucketName:
    Type: String
    Default: 'the-autistic-journey-media-vault'
    Description: 'Globally unique name prefix for the private media storage bucket'

  WebBucketName:
    Type: String
    Default: 'the-autistic-journey-web-hosting'
    Description: 'Globally unique name prefix for the web static hosting bucket'

Resources:
  # ============================================================================
  # 1. Private Media Vault S3 Bucket (Zero Public Access)
  # ============================================================================
  MediaVaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${MediaBucketName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: TransitionOldVersionsToStandardIA
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins:
              - 'https://theautisticjourney.me'
              - 'https://gallery.theautisticjourney.me'
              - 'https://api.theautisticjourney.me'
              - 'http://localhost:3000'
              - 'http://localhost:8000'
              - 'http://localhost:8080'
            MaxAge: 3600

  # ============================================================================
  # 2. Frontend Web Assets S3 Bucket
  # ============================================================================
  WebHostingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${WebBucketName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ============================================================================
  # 3. IAM Least-Privilege Policy for FastAPI Backend
  # ============================================================================
  BackendS3ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AWS::StackName}-BackendS3Policy'
      Description: 'Strict least-privilege permissions for media uploads and presigned delivery'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ScopedMediaBucketAccess
            Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:DeleteObject'
              - 's3:AbortMultipartUpload'
              - 's3:ListMultipartUploadParts'
            Resource:
              - !Sub '${MediaVaultBucket.Arn}/*'
          - Sid: ScopedBucketListing
            Effect: Allow
            Action:
              - 's3:ListBucket'
            Resource:
              - !GetAtt MediaVaultBucket.Arn

Outputs:
  MediaVaultBucketName:
    Description: 'Private S3 Media Bucket Name'
    Value: !Ref MediaVaultBucket
    Export:
      Name: !Sub '${AWS::StackName}-MediaBucketName'

  WebHostingBucketName:
    Description: 'S3 Web Hosting Bucket Name'
    Value: !Ref WebHostingBucket
    Export:
      Name: !Sub '${AWS::StackName}-WebBucketName'

  BackendS3PolicyArn:
    Description: 'IAM Managed Policy ARN for FastAPI Backend'
    Value: !Ref BackendS3ExecutionPolicy
    Export:
      Name: !Sub '${AWS::StackName}-BackendS3PolicyArn'
