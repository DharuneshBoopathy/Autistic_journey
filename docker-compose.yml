# Self-hosting, for one batch on one machine.
#
# Managed Postgres is the better default — it gives you point-in-time recovery,
# which the dumps in docs/OPERATIONS.md cannot. Use this when you would rather own
# the machine, and read the backup runbook before you put real photographs in it.
#
#   cp .env.example .env && edit it
#   docker compose run --rm migrate
#   docker compose run --rm seed --batch "CSE 2021-2025" --start 2021 --end 2025 \
#       --email you@example.com --name "Your Name"
#   docker compose up -d
#
# TLS is handled by the `caddy` service, which obtains a free Let's Encrypt
# certificate automatically. Point ARCHIVE_DOMAIN at this machine's public address
# before starting it, and set APP_ORIGIN to the same https:// address — session
# cookies use the `__Host-` prefix, which browsers refuse over plain http.

name: autistic-journey

services:
  # Free, automatic HTTPS. See Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ARCHIVE_DOMAIN: ${ARCHIVE_DOMAIN:?set ARCHIVE_DOMAIN in .env}
      ARCHIVE_ACME_EMAIL: ${ARCHIVE_ACME_EMAIL:?set ARCHIVE_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that, so it is a named volume rather than a
      # container's scratch space.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autistic_journey}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host: only the app and worker need to reach it.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-archive}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autistic_journey}
    # Not published to the host: caddy is the only thing that should reach it, and
    # binding 3000 publicly would be an unencrypted way in past the certificate.
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Only used when STORAGE_*_DRIVER=local. On R2 this is inert.
      - storage:/app/var/storage

  # Its own process, which is the right shape wherever the host will run one.
  # On hosting that will not, drop this service and set WORKER_IN_PROCESS=true.
  worker:
    build: .
    restart: unless-stopped
    command: ['node', 'dist/worker/index.mjs']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autistic_journey}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/var/storage

  # One-shot jobs. `docker compose run --rm migrate`
  migrate:
    build: .
    profiles: ['jobs']
    command: ['node', 'dist/db/migrate.mjs']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autistic_journey}
    depends_on:
      db:
        condition: service_healthy

  # `docker compose run --rm seed -- --batch "…" --start 2021 --end 2025 --email … --name "…"`
  # ADMIN_PASSWORD comes from the environment so it never lands in shell history.
  seed:
    build: .
    profiles: ['jobs']
    entrypoint: ['node', 'dist/db/seed.mjs']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autistic_journey}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
